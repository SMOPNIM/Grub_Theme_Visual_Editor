name: spike-ci
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install
      # Single workspace-wide gate: new packages are covered without editing CI.
      - run: pnpm -r test
      - run: node scripts/collect-fixtures.mjs
      - run: pnpm --filter ./apps/editor build
  linux-tauri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fail-fast first: config-class errors (pnpm/node/install) surface before the
      # ~1min apt install, so a bad setup doesn't burn apt time every round.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf grub-common
      # Real-call smoke: proves the binary exists for the shell:allow-execute scope.
      # grub2-theme-preview is a Python script upstream (argv[0] may be an interpreter);
      # scope match against it is verified at vertical slice, not in Spike.
      - run: grub-mkfont --version
      - run: which grub2-theme-preview || echo "grub2-theme-preview absent (expected on CI image)"
      # Icon gate (platform-independent): tauri's generate_context! requires RGBA
      # icon.png even with bundle.active:false; Windows .ico path is laxer. Verify
      # IHDR colortype+dimensions here so a bad icon fails in seconds, not after
      # the full Rust compile. Asymmetry incidents so far: 3 (missing .ico,
      # RGB .ico tolerated on Win, non-RGBA .png rejected on Linux).
      - run: python3 scripts/make-icons.py --verify
      - run: pnpm --filter ./apps/editor build
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/editor/src-tauri -> target
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/editor/src-tauri
          args: --debug
  # dialog dynamic-auth e2e (desktop, post-Spike): open a theme.txt outside $APPDIR
  # via dialog, then fs-read it. Requires WebDriver + display; tracked for UI-1,
  # not runnable headless in Spike. Gate1-spike only asserts compile.
